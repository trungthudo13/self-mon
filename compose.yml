name: observability

services:
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: monitor-grafana
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Always include internal hosts: shell NO_PROXY can override .env values.
      NO_PROXY: "${NO_PROXY:-},localhost,127.0.0.1,::1,grafana,prometheus,loki,alloy,tempo,monitor-grafana,monitor-prometheus,monitor-loki,monitor-alloy,monitor-tempo"
      no_proxy: "${no_proxy:-},localhost,127.0.0.1,::1,grafana,prometheus,loki,alloy,tempo,monitor-grafana,monitor-prometheus,monitor-loki,monitor-alloy,monitor-tempo"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: monitor-prometheus
    env_file:
      - .env
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=20GB"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: monitor-node-exporter
    env_file:
      - .env
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: monitor-cadvisor
    env_file:
      - .env
    restart: unless-stopped
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=5s"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:${DOCKER_DATA_ROOT:-/var/lib/docker}:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  loki:
    image: docker.io/grafana/loki:latest
    container_name: monitor-loki
    env_file:
      - .env
    # Local storage only; internal gRPC advertises container IPs, not DNS names.
    environment:
      NO_PROXY: "*"
      no_proxy: "*"
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring

  alloy:
    image: docker.io/grafana/alloy:latest
    container_name: monitor-alloy
    env_file:
      - .env
    user: "0:0"
    restart: unless-stopped
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - label=disable
    networks:
      - monitoring

  tempo:
    image: docker.io/grafana/tempo:2.9.0
    container_name: monitor-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - monitoring

networks:
  monitoring:
    name: docker-monitoring

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
  tempo-data:
